spring.application.name=SimpleShop
server.port=8080
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:simpleshop;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
simpleshop.admin.email=${SIMPLESHOP_ADMIN_EMAIL:admin@simpleshop.local}
simpleshop.admin.password=${SIMPLESHOP_ADMIN_PASSWORD:Admin@12345}
